<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Wallet Connector</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #9945FF;
            text-align: center;
        }
        button {
            background-color: #9945FF;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin: 10px 0;
        }
        button:hover {
            background-color: #7D3DCD;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .info-box {
            background-color: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .hidden {
            display: none;
        }
        .success {
            color: green;
            font-weight: bold;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Solana Wallet Connector</h1>
        
        <div id="connectSection">
            <button id="connectButton">Connect Wallet</button>
        </div>
        
        <div id="walletInfo" class="info-box hidden">
            <p><strong>Connected Wallet:</strong> <span id="walletAddress">-</span></p>
            <p><strong>Balance:</strong> <span id="walletBalance">0 SOL</span></p>
        </div>
        
        <div id="transactionSection" class="hidden">
            <h2>Send Tokens</h2>
            <select id="tokenSelect">
                <option value="sol">SOL</option>
                <option value="usdc">USDC</option>
            </select>
            <input type="text" id="recipientAddress" placeholder="Recipient Address">
            <input type="number" id="amount" placeholder="Amount" step="0.000000001">
            <button id="sendButton">Send Transaction</button>
            <div id="transactionResult"></div>
        </div>
    </div>

    <script>
        // DOM Elements
        const connectButton = document.getElementById('connectButton');
        const walletInfo = document.getElementById('walletInfo');
        const walletAddress = document.getElementById('walletAddress');
        const walletBalance = document.getElementById('walletBalance');
        const transactionSection = document.getElementById('transactionSection');
        const tokenSelect = document.getElementById('tokenSelect');
        const recipientAddress = document.getElementById('recipientAddress');
        const amountInput = document.getElementById('amount');
        const sendButton = document.getElementById('sendButton');
        const transactionResult = document.getElementById('transactionResult');

        // Solana Connection
        const connection = new solanaWeb3.Connection('https://api.mainnet-beta.solana.com', // Or your preferred RPC endpoint
    'confirmed'
);
            solanaWeb3.clusterApiUrl('mainnet-beta'), // Change to 'mainnet-beta' for mainnet
            'confirmed'
        );

        // Phantom Wallet Integration
        let provider = null;
        let wallet = null;

        // Check if Phantom wallet is installed
        window.addEventListener('load', async () => {
            if (window.solana && window.solana.isPhantom) {
                provider = window.solana;
            } else {
                connectButton.disabled = true;
                connectButton.textContent = "Phantom Wallet Not Detected";
                alert("Please install Phantom wallet from https://phantom.app/");
            }
        });

        // Connect Wallet
        connectButton.addEventListener('click', async () => {
            try {
                const response = await provider.connect();
                wallet = response.publicKey;
                walletAddress.textContent = wallet.toString();
                
                // Get balance
                await updateBalance();
                
                // Show wallet info and transaction section
                walletInfo.classList.remove('hidden');
                transactionSection.classList.remove('hidden');
                connectButton.textContent = "Wallet Connected";
                connectButton.disabled = true;
            } catch (err) {
                console.error("Connection failed:", err);
                alert("Failed to connect wallet");
            }
        });

        // Update wallet balance
        async function updateBalance() {
            try {
                const balance = await connection.getBalance(wallet);
                walletBalance.textContent = `${balance / solanaWeb3.LAMPORTS_PER_SOL} SOL`;
            } catch (err) {
                console.error("Failed to get balance:", err);
                walletBalance.textContent = "Error fetching balance";
            }
        }

        // Send Transaction
        sendButton.addEventListener('click', async () => {
            const recipient = recipientAddress.value.trim();
            const amount = parseFloat(amountInput.value);
            
            if (!recipient || isNaN(amount) || amount <= 0) {
                showResult("Please enter valid recipient and amount", "error");
                return;
            }
            
            if (!wallet) {
                showResult("Wallet not connected", "error");
                return;
            }
            
            try {
                // Create transaction
                const transaction = new solanaWeb3.Transaction();
                const recipientPubKey = new solanaWeb3.PublicKey(recipient);
                
                if (tokenSelect.value === 'sol') {
                    // SOL transfer
                    transaction.add(
                        solanaWeb3.SystemProgram.transfer({
                            fromPubkey: wallet,
                            toPubkey: recipientPubKey,
                            lamports: amount * solanaWeb3.LAMPORTS_PER_SOL
                        })
                    );
                } else {
                    // USDC transfer (simplified - in practice requires token program interaction)
                    showResult("USDC transfers require additional setup", "error");
                    return;
                }
                
                // Get latest blockhash
                const { blockhash } = await connection.getLatestBlockhash();
                transaction.recentBlockhash = blockhash;
                transaction.feePayer = wallet;
                
                // Sign and send transaction
                const signedTransaction = await provider.signTransaction(transaction);
                const signature = await connection.sendRawTransaction(signedTransaction.serialize());
                
                // Confirm transaction
                const confirmation = await connection.confirmTransaction(signature, 'confirmed');
                
                if (confirmation.value.err) {
                    throw new Error('Transaction failed');
                }
                
                showResult(`Transaction successful! Signature: ${signature}`, "success");
                await updateBalance();
                
                // Reset form
                recipientAddress.value = '';
                amountInput.value = '';
            } catch (err) {
                console.error("Transaction failed:", err);
                showResult(`Transaction failed: ${err.message}`, "error");
            }
        });

        // Show transaction result
        function showResult(message, type) {
            transactionResult.textContent = message;
            transactionResult.className = type;
        }
    </script>
</body>
</html>
